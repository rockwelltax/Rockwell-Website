<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FBF9F6" />
  <title>Coming Soon &mdash; Rockwell Tax &amp; Digital Strategies Inc.</title>
  <meta name="description" content="Rockwell Tax &amp; Digital Strategies Inc. is launching soon. Premium tax preparation, bookkeeping, and digital operations." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/typography.css" />
  <link rel="stylesheet" href="/pages/coming-soon/coming-soon.css" />

  <!-- Lottie Player -->
  <script src="/assets/js/lottie-player.js"></script>
</head>
<body class="cs-body">

  <!-- Background Ambience (Clean Luxury Glow - Warm Light Canvas) -->
  <div class="cs-bg-glow cs-bg-glow--top"></div>
  <div class="cs-bg-glow cs-bg-glow--bottom"></div>

  <div class="cs-layout">
    <!-- Header -->
    <header class="cs-header">
      <div class="cs-brand">
        <img src="../../assets/icons/favicon.png" alt="Rockwell Crest" class="cs-brand__logo" width="44" height="44" />
        <div class="cs-brand__text">
          <span class="cs-brand__name">Rockwell</span>
          <span class="cs-brand__tag">Tax &amp; Digital Strategies Inc.</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="cs-main">
      <div class="cs-hero">
        <!-- Lottie Animation -->
        <div class="cs-lottie-wrap">
          <lottie-player
            src="/assets/animations/launch.json"
            background="transparent"
            speed="1"
            style="width: 250px; height: 250px;"
            loop
            autoplay>
          </lottie-player>
        </div>

        <h1 class="cs-title">Coming Soon</h1>

        <!-- Dynamic Countdown Container -->
        <div class="cs-countdown-wrap" id="cs-countdown-wrap" style="display: none;">
          <div class="cs-countdown-label">Official Public Launch In:</div>
          <div class="cs-countdown-grid" id="cs-countdown-grid">
            <div class="cs-time-box">
              <span class="cs-time-num" id="cd-days">00</span>
              <span class="cs-time-unit">Days</span>
            </div>
            <div class="cs-time-sep">:</div>
            <div class="cs-time-box">
              <span class="cs-time-num" id="cd-hours">00</span>
              <span class="cs-time-unit">Hours</span>
            </div>
            <div class="cs-time-sep">:</div>
            <div class="cs-time-box">
              <span class="cs-time-num" id="cd-mins">00</span>
              <span class="cs-time-unit">Mins</span>
            </div>
            <div class="cs-time-sep">:</div>
            <div class="cs-time-box">
              <span class="cs-time-num" id="cd-secs">00</span>
              <span class="cs-time-unit">Secs</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="cs-footer">
      <div class="cs-footer__copy">
        &copy; 2026 Rockwell Tax &amp; Digital Strategies Inc. All rights reserved.
      </div>
      <div class="cs-footer__links">
        <a href="mailto:Info@rockwelldigital.com">Info@rockwelldigital.com</a>
      </div>
    </footer>
  </div>

  <script src="/pages/coming-soon/coming-soon.js"></script>
</body>
</html>
