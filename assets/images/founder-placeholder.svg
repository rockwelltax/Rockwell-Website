<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29211D" />
      <stop offset="60%" stop-color="#1F1916" />
      <stop offset="100%" stop-color="#2D2420" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BCA18A" />
      <stop offset="50%" stop-color="#D9C7B6" />
      <stop offset="100%" stop-color="#BCA18A" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3892A9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3892A9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="url(#tealGlow)"/>

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="32" y="32" width="536" height="686" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Corner Flourishes -->
  <line x1="20" y1="24" x2="44" y2="24" stroke="#BCA18A" stroke-width="2"/>
  <line x1="24" y1="20" x2="24" y2="44" stroke="#BCA18A" stroke-width="2"/>
  <line x1="556" y1="24" x2="580" y2="24" stroke="#BCA18A" stroke-width="2"/>
  <line x1="576" y1="20" x2="576" y2="44" stroke="#BCA18A" stroke-width="2"/>
  <line x1="20" y1="726" x2="44" y2="726" stroke="#BCA18A" stroke-width="2"/>
  <line x1="24" y1="706" x2="24" y2="730" stroke="#BCA18A" stroke-width="2"/>
  <line x1="556" y1="726" x2="580" y2="726" stroke="#BCA18A" stroke-width="2"/>
  <line x1="576" y1="706" x2="576" y2="730" stroke="#BCA18A" stroke-width="2"/>

  <!-- Central Silhouette / Emblem Area -->
  <circle cx="300" cy="280" r="110" fill="#29211D" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="300" cy="280" r="98" fill="none" stroke="#3892A9" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- Monogram -->
  <text x="300" y="302" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">FAS</text>

  <!-- Decorative Divider -->
  <line x1="200" y1="440" x2="400" y2="440" stroke="#3892A9" stroke-width="1.5"/>
  <circle cx="300" cy="440" r="4" fill="#BCA18A"/>

  <!-- Text Hierarchy -->
  <text x="300" y="490" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Fritzie Ann Silva</text>
  <text x="300" y="522" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3892A9" text-anchor="middle" letter-spacing="3">FOUNDER &amp; PRINCIPAL</text>
  <text x="300" y="554" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#BCA18A" text-anchor="middle" letter-spacing="1">B.S. COMPUTER SCIENCE • M.S. DATABASE TECHNOLOGIES</text>

  <!-- Status / Approval Badge -->
  <g transform="translate(140, 610)">
    <rect width="320" height="42" rx="4" fill="#BCA18A" fill-opacity="0.12" stroke="#BCA18A" stroke-width="1" stroke-opacity="0.4"/>
    <text x="160" y="26" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#D9C7B6" text-anchor="middle" letter-spacing="1.2">OFFICIAL PORTRAIT PLACEMENT</text>
  </g>
  <text x="300" y="675" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle">Pending client photograph approval before publication</text>
</svg>
